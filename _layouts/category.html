---
layout: default
---

<div class="post-content" style="padding-top: 20px;">
  <h1 class="post-title" style="text-align: center; margin-bottom: 15px; font-weight: 700;">
    {{ page.title }}
  </h1>
  
  <hr style="border: 0.5px solid #eee; width: 90%; margin: 0 auto 40px auto;">

  <ul class="post-list" style="list-style-type: none; padding-left: 80px; padding-right: 40px;">
    {% for post in site.categories[page.category] %}
      <li style="margin-bottom: 40px; border-bottom: 0.5px solid #f9f9f9; padding-bottom: 20px;">
        <span class="post-meta" style="color: #999; font-size: 0.85em; display: block; margin-bottom: 8px;">
          {{ post.date | date: "%Y년 %m월 %d일" }}
        </span>
        
        <h2 style="margin: 0; font-size: 1.5em; line-height: 1.4;">
          <a class="post-link" href="{{ post.url | relative_url }}" style="text-decoration: none; color: #333; font-weight: 700;">
            {{ post.title }}
          </a>
        </h2>

        <p style="margin-top: 12px; color: #666; font-size: 0.95em; line-height: 1.7;">
          {{ post.excerpt | strip_html | truncate: 200 }}
        </p>
      </li>
    {% endfor %}
  </ul>
</div>
